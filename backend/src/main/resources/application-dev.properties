# === Dev overrides ===
quarkus.log.console.json=false
quarkus.hibernate-orm.log.sql=true
quarkus.swagger-ui.always-include=true

# Banco local (docker-compose)
quarkus.datasource.username=fht_user
quarkus.datasource.password=fht_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5433/fht_db

# Rede de seguranca: Hibernate confere o schema da V1 contra as entidades ao subir.
# So em dev; em prod fica generation=none (application.properties).
quarkus.hibernate-orm.database.generation=validate

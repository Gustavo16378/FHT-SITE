version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fht_postgres
    environment:
      POSTGRES_DB: fht_db
      POSTGRES_USER: fht_user
      POSTGRES_PASSWORD: fht_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fht_user -d fht_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

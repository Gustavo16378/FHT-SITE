name: Deploy FHT Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build com Maven
        run: ./mvnw package -DskipTests -B

      - name: Login Docker Hub (ou Railway registry)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build e Push imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/fht-backend:latest,${{ secrets.REGISTRY_URL }}/fht-backend:${{ github.sha }}

      - name: Deploy no Railway
        run: |
          curl -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"deploy": true}'

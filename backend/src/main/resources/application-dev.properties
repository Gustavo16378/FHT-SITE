# === Dev overrides ===
quarkus.log.console.json=false
quarkus.hibernate-orm.log.sql=true
quarkus.swagger-ui.always-include=true

# Banco local (docker-compose)
quarkus.datasource.username=fht_user
quarkus.datasource.password=fht_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5433/fht_db

# Rede de seguranca: Hibernate confere o schema da V1 contra as entidades ao subir.
# So em dev; em prod fica generation=none (application.properties).
quarkus.hibernate-orm.database.generation=validate

# Seed de demonstração (db/dev/R__seed_dev.sql) só no perfil dev. Build-time: vale no quarkus:dev.
quarkus.flyway.locations=classpath:db/migration,classpath:db/dev
# Senha do admin da V2: em dev tem padrão de teste; em prod é obrigatória (application.properties).
quarkus.flyway.placeholders.admin_senha=${FHT_ADMIN_SENHA:123456}

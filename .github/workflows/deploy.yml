name: Backend — imagem no GHCR e deploy no Render

on:
  push:
    branches: [mvp-free-tier, main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: fht-backend

jobs:
  build-push-deploy:
    name: Build da imagem + push no GHCR + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (o GHCR exige o owner em minúsculas)
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O Maven roda AQUI, dentro do Dockerfile multi-stage (JVM). O Render free só puxa a
      # imagem pronta — nada é compilado lá.
      - name: Build da imagem e push (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy no Render (Deploy Hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL não configurado — imagem publicada, deploy não disparado."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy disparado no Render."

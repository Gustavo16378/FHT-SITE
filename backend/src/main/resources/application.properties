# === Datasource ===
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:fht_user}
quarkus.datasource.password=${DB_PASS:fht_pass}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:fht_db}

# === Hibernate ===
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# === Flyway ===
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# === JWT ===
mp.jwt.verify.issuer=https://fht.org.br
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.token.lifespan=86400

# === Swagger ===
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.info-title=FHT API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API da Federacao de Handebol do Tocantins

# === CORS ===
quarkus.http.cors=true
quarkus.http.cors.origins=https://fht.org.br,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# === Upload ===
quarkus.http.limits.max-body-size=10M

# === Cloudflare R2 ===
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:fht-documentos}
r2.public-url=${R2_PUBLIC_URL:}

# === Sentry ===
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENV:production}

# === Logs JSON ===
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false

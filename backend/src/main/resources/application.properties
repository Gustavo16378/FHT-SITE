# === HTTP ===
# O Render injeta PORT; localmente cai no 8080.
quarkus.http.port=${PORT:8080}

# === Datasource ===
quarkus.datasource.db-kind=postgresql
# Produção (Render + Neon): DATABASE_URL é a URL JDBC completa do Neon, com sslmode=require,
# e DATABASE_USER / DATABASE_PASSWORD as credenciais. Sem elas (docker compose / dev), a URL é
# montada a partir de DB_HOST/DB_PORT/DB_NAME como sempre foi.
quarkus.datasource.username=${DATABASE_USER:${DB_USER:fht_user}}
quarkus.datasource.password=${DATABASE_PASSWORD:${DB_PASS:fht_pass}}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:fht_db}}
# Pool pequeno e sem conexão ociosa: o Neon free limita conexões e hiberna o banco.
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.initial-size=0

# === Hibernate ===
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# === Flyway ===
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# Senha do primeiro ADMIN_FHT, usada UMA vez pela V2__seed_admin.sql, que grava só o hash bcrypt
# (crypt/gen_salt no Postgres). SEM default de propósito: sem FHT_ADMIN_SENHA a app não sobe.
# O perfil dev sobrescreve com um padrão de teste (application-dev.properties).
quarkus.flyway.placeholders.admin_senha=${FHT_ADMIN_SENHA}

# === JWT ===
mp.jwt.verify.issuer=https://fht.org.br
# Dev: chaves nos .pem locais (o setup.sh gera; ficam fora do git).
# Produção e docker compose: as chaves vêm das env JWT_PUBLIC_KEY / JWT_PRIVATE_KEY, com o .pem
# em base64 numa linha só (JwtKeysEnvConfigSource decodifica) — os .pem nunca entram na imagem.
# Em prod as locations ficam vazias de propósito: sem JWT_PUBLIC_KEY/JWT_PRIVATE_KEY no ambiente o
# serviço nem sobe ("Failed to load config value ... mp.jwt.verify.publickey.location"), em vez de
# subir e só falhar no login. É fail-fast intencional — ver README.
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
%prod.mp.jwt.verify.publickey.location=
%prod.smallrye.jwt.sign.key.location=
smallrye.jwt.token.lifespan=86400

# === Swagger ===
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.info-title=FHT API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API da Federacao de Handebol do Tocantins

# === CORS ===
quarkus.http.cors=true
# Lista separada por vírgula. Em produção: a URL do site no Cloudflare Pages (e o domínio, quando houver).
quarkus.http.cors.origins=${CORS_ORIGINS:https://fht.org.br,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# === Upload ===
quarkus.http.limits.max-body-size=10M

# === E-mail ===
# MOCK=true (padrão): NÃO envia de verdade — o e-mail aparece no log. É assim que roda em dev
# e enquanto o domínio fht.org.br não estiver com DNS/SPF/DKIM configurados.
# Para ligar de verdade: preencher SMTP_HOST/USER/PASS e SMTP_MOCK=false. Nenhum código muda.
quarkus.mailer.mock=${SMTP_MOCK:true}
quarkus.mailer.from=${SMTP_FROM:nao-responda@fht.org.br}
quarkus.mailer.host=${SMTP_HOST:smtp.gmail.com}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASS:}
quarkus.mailer.start-tls=REQUIRED
# Caixa da federação que recebe os avisos operacionais (nova filiação, pagamento recebido)
fht.email.admin=${FHT_EMAIL_ADMIN:contato@fht.org.br}
fht.email.habilitado=${FHT_EMAIL_HABILITADO:true}

# === Anuidade do atleta ===
# Fonte ÚNICA do valor: alimenta a soma do botão de pagamento do clube e o valor gravado
# em cada item do lote. Antes o 35 estava escrito em 3 lugares diferentes.
fht.anuidade.valor=${FHT_ANUIDADE_VALOR:35.00}

# === Fluxo de filiação do atleta ===
# Dias de tolerância antes de descartar um cadastro que nunca foi pago (LGPD art. 6, III).
# O pagamento é em lote, no tempo do clube — por isso o prazo é longo, não de horas.
atleta.expurgo.dias=${ATLETA_EXPURGO_DIAS:90}

# === Cloudflare R2 ===
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:fht-documentos}
r2.public-url=${R2_PUBLIC_URL:}

# === Logs JSON ===
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
